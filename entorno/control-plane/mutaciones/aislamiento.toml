# POR QUE ESTE CATALOGO.
#
# Una auditoria adversarial demostro, ejecutandolo, que una mision delegada leia y escribia FUERA de
# su sandbox. La correccion es confinamiento del kernel — pero un confinamiento que no se ejerce es
# una promesa, y aqui la promesa es de seguridad.
#
# Cada mutante degrada una capa y la prueba correspondiente tiene que ver el escape. La condicion es
# mas dura que de costumbre: no basta con que la prueba falle, tiene que fallar **porque el fichero
# aparecio fuera del sandbox**, que es lo que las aserciones comprueban.

