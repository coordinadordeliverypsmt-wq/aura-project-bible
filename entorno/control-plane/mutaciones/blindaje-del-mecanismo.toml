# BLINDAJE DEL MECANISMO (CEO, 2026-09-20) — antes del primer acto autonomo.
#
# Que se protege: el mecanismo que decide que puede tocar el anillo deja de ser escribible POR el
# anillo. `_INTOCABLES` pasa de 4 a 8 entradas y la tarea empieza a llevar la identidad del contrato
# que la autoriza.
#
# **Por que hay un mutante por cada entrada nueva y no uno solo para la tupla.** Un unico mutante que
# vaciara la tupla entera moriria con cualquiera de las cuatro pruebas y no diria nada sobre las otras
# tres: bastaria una para dar la garantia por cubierta. Quitando UNA sola entrada cada vez, un hueco
# de cobertura en cualquiera de los cuatro ficheros aparece como superviviente con nombre y apellido.
#
# Los dos ultimos mutantes degradan el CABLEADO, no la logica: el campo que transporta la identidad
# del contrato y la resolucion del nombre real. El mutante «la composicion no enciende las
# automatizaciones» sobrevivio una vez con 426 pruebas en verde, y era ALERTA-005 otra vez.
#
# Como se ejecuta (nunca en paralelo con nada):
#   cd walking-skeleton
#   python3 -m herramientas.mutar ../entorno/control-plane/mutaciones/blindaje-del-mecanismo.toml \
#           --raiz ../entorno/control-plane

incremento = "BLINDAJE DEL MECANISMO (CEO, 2026-09-20): _INTOCABLES 4 -> 8 y la tarea lleva su contrato"
pruebas = ["test_red_blindaje_del_mecanismo.py", "test_red_tarea_lleva_su_contrato.py"]
