# DP-ALERTA-005 (Alternativa B) · CONTRATO DE CORRESPONDENCIA VERIFICABLE (CEO, 2026-11-08).
#
# Que se protege: la matriz de correspondencia declarada en
# `milestones/m3-entry/DP-ALERTA-005-CORRESPONDENCIA.md` -una sola fuente de hechos, dos
# proyecciones (Maquina A de estados de tarea, Maquina B del ciclo real), dos gates de autoridad
# fail-closed, y la proteccion-por-prueba de la API legada `autoconstruccion.ciclo()`-.
#
# CA-M1/CA-M2/CA-M3/CA-M5 degradan el CABLEADO de la puerta gobernada comun (misma clase de
# defecto que `eventos-de-autoridad.toml` ya probo: sacar un evento de la lista sin tocar la
# puerta deja la puerta intacta y la via cruda abierta al lado). CA-M4 degrada la guarda de
# autoridad humana de `WAITING_FOR_HUMAN`. CA-M6 simula la aparicion de un llamante de produccion
# de la API legada, que es el escenario que el contrato §8 exige detectar.
#
# Como se ejecuta (nunca en paralelo con nada, CLAUDE.md §2):
#   cd walking-skeleton
#   python3 -m herramientas.mutar ../entorno/control-plane/mutaciones/correspondencia-alerta005.toml \
#           --raiz ../entorno/control-plane

incremento = "DP-ALERTA-005 (Alternativa B): contrato de correspondencia verificable del control-plane"
pruebas = ["test_red_correspondencia_alerta005.py"]
timeout_s = 300


