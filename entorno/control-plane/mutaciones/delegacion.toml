# POR QUE CADA MUTANTE.
#
# Esta capacidad presta autoridad. Una barrera suya que estuviera declarada y no protegiera no seria
# una deuda menor: seria una via de escalada. Por eso se muta **el cableado**, no solo la logica —
# la leccion del mutante «la composicion no enciende las automatizaciones», que sobrevivio con 426
# pruebas en verde.
#
# Las dos puertas —`delegar` y `ejecutar`— se mutan por separado a proposito: comprobar algo solo al
# conceder deja una ventana entre conceder y usar, y ese es el hueco por el que se cuela una
# credencial fabricada a mano.

