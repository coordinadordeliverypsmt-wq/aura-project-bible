# `PARADA` es la garantia mas fuerte del plano: *«mecanismo fuera de banda (Bible 5.3): basta la
# PRESENCIA del fichero. No hace falta que el orquestador colabore»*. Un kill switch que dependiera
# de la cooperacion del sistema al que detiene no seria un kill switch.
#
# Auditado el 2026-09-21: la funcion `orquestador.parada_solicitada()` se consulta en **cinco**
# puntos de produccion —`autoconstruccion.py:596`, `motor_autonomia.py:96`, `despertador.py:65`,
# `observatorio.py:518` y `orquestador.py:566`— y **solo el primero** tenia mutante (`BA-M4`, del
# blindaje del anillo). En los otros cuatro, borrar la consulta no habria hecho fallar nada
# declarado: el interruptor seguiria existiendo, probado como funcion pura, sin proteger el camino.
#
# Es exactamente la leccion que este proyecto ya pago: **el mutante «la composicion no enciende las
# automatizaciones» sobrevivio con 426 pruebas en verde**. Se muta el CABLEADO, no solo la logica.
#
# Estos mutantes no cambian ninguna politica ni conceden nada: comprueban que cada punto donde el
# sistema dice consultar el kill switch lo consulta de verdad.

