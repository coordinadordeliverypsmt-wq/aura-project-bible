#  PRIMER CONTRATO DE INCREMENTO — etiqueta inequívoca del observatorio
#
#  Preparado por el CTO el 2026-09-16 bajo la autorización del CEO («PROMPT CEO — DESBLOQUEO», §8).
#
#  QUÉ ARREGLA. El observatorio presenta al humano la línea «Trabajo ejecutado (total)», pero el
#  número que muestra es `len([t for t in _trabajos_en(eventos) if _efecto_real(t)])`
#  (`observatorio.py:502`): cuenta solo los trabajos cuyo EFECTO quedó acreditado, no los aplicados.
#  De ahí el 11 frente a 12: P-017 se aplicó y se revirtió, así que cuenta como aplicado pero no como
#  efecto. No hay ningún error de conteo — la etiqueta es ambigua y el número es correcto.
#
#  POR QUÉ ESTE INCREMENTO Y NO OTRO:
#    · ZONA: `entorno/control-plane/` — la que YA está autorizada. **Cero ampliación de zona.**
#    · ACCIÓN: `sustituir_texto`, que ya está en `autoconstruccion.OPERACIONES`.
#    · Una sola aparición en todo el fichero: no hay nada que elegir, luego nada que interpretar.
#    · No cambia NINGÚN número, ninguna función, ningún evento y ninguna semántica del motor.
#    · La sustitución EXTIENDE la etiqueta en vez de reemplazarla, de modo que
#      `test_red_observatorio.py:557` —que comprueba la presencia de «Trabajo ejecutado»— sigue en
#      verde. Un incremento que rompiera su propia batería sería revertido por el ejecutor, y con
#      razón; este no la rompe por diseño.
#    · Reversible por el mecanismo estándar: el ejecutor guarda el original y lo restaura.
#
#  ESTE FICHERO NO CONCEDE AUTORIDAD. Vive en `milestones/`, zona donde AURA no puede escribir, y sus
#  campos `autoridad.acta` y `ejecutor.verbo` son CITAS que el mecanismo verifica contra el historial
