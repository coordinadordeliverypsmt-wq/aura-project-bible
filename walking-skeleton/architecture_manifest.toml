# architecture_manifest.toml
#
# FUENTE UNICA DE VERDAD de la clasificacion de ejecutables del sistema (principio D41).
# La consume la prueba anti-regresion tests/unit/test_manifiesto_arquitectura.py (MA.5-a).
#
# NO duplicar esta clasificacion en codigo ni documentacion: la doc la REFERENCIA
# (milestones/m3-entry/MA.5-a-convergencia-validacion-produccion.md), no la copia.
#
# Regla (D40, ADR-0018):
#   - El unico punto de entrada de PRODUCCION consume composicion.componer() y NO construye
#     Orchestrator directamente.
#   - composicion.py es el UNICO lugar que ensambla el sistema (construye Orchestrator por definicion).
#   - Los ARNESES de validacion pueden ensamblar variantes deliberadas (otro bus, varios proveedores,
#     un componente aislado) SOLO si estan declarados aqui.
#
# CRITERIO DE ADMISION de un arnes (CEO, 2026-07-22):
#   Un arnes solo puede quedar en el manifiesto si necesita una variacion deliberada que NO tendria
#   sentido incorporar al cableado de produccion. Si esa variacion pasa a tener valor para produccion,
#   se revisa si debe convertirse en una capacidad de composicion(); de lo contrario, permanece como
#   arnes autorizado.
#
# Rutas relativas a walking-skeleton/.

[produccion]
# Punto(s) de entrada de produccion: consumen composicion; NO construyen Orchestrator.
entrypoints = ["aura_skeleton/__main__.py"]
# El unico lugar que ensambla el sistema. Construye Orchestrator por definicion (no es excepcion).
composicion = "aura_skeleton/composicion.py"

# --- Arneses de validacion autorizados a construir el sistema fuera de composicion ---

[[arneses]]
archivo = "run_demo_nats.py"
motivo = "sustituibilidad de bus in-process->NATS (E2, P-ARQ-4); unico que ejercita bus_nats.py"

[[arneses]]
archivo = "run_demo_real.py"
motivo = "stack real / HC-1 (E2, hardware)"

[[arneses]]
archivo = "validar_m1.py"
motivo = "metricas de latencia HC-1 en hardware"

[[arneses]]
archivo = "evals_m1.py"
motivo = "evals de seguridad sobre modelo real (HITL lista roja, grounding, consistencia)"

[[arneses]]
archivo = "demo_capacidad_m1.py"
motivo = "demo de capacidad M1, ruta --real en hardware"

[[arneses]]
archivo = "demo_capacidad_m2.py"
motivo = "demo de capacidad M2 reproducible; necesita un proveedor guionado (_ProveedorGuiado), un doble determinista que no tendria sentido en produccion (criterio de admision)"

[no_construyen_sistema]
# No crean Orchestrator: no son puntos de entrada del sistema. D40 no les aplica.
scripts = ["validar_voz_t2.py", "generar_m1_exit.py"]

# --- Candidatos a eliminacion (clasificados, con evidencia). No se eliminan sin gate. ---
# (Sin candidatos actualmente: run_demo.py fue retirado en MA.5-a por convergencia arquitectonica.)

# =============================================================== MUTACIONES (G-1) --
#
# Entrada del verificador de la garantia G-1 — Ruta Unica de Mutacion (DP-D-M-8 §6, ESPEC-G-1 §3.1).
# Lo consume tests/unit/verificador_g1.py. NO se duplica en codigo (D41): se deriva de aqui.
#
# Aprobacion delimitada del CEO, D-G1-2, 2026-08-18. El GRUPO B queda DELIBERADAMENTE FUERA:
# core/decisiones.py, conectores/auditoria.py, adapters/programador.py y adapters/computador.py
# NO estan autorizados, y su ausencia aqui es la razon de que R-B siga reportandolos.

[mutaciones]
motor = "aura_skeleton/core/automatizacion.py"

# F2 · quien puede tocar el disco directamente. GRUPO A aprobado (D-G1-2).
persistencia_autorizada = [
  "aura_skeleton/modules/memory.py",        # almacen declarado (ESPEC-G-1 §3.1)
  "aura_skeleton/core/reglas.py",           # almacen declarado; ADR-0023 lo cita como patron correcto
  "aura_skeleton/observability.py",         # audit log append-only + sellado (ESPEC-G-1 §3.1)
  "aura_skeleton/core/estado_operativo.py", # ADR-0023 lo reconoce como almacen append-only
]

# --- F1 · superficie mutante de cada almacen. R-C exige clasificar TODO metodo publico.
[[mutaciones.almacen]]
modulo   = "aura_skeleton/modules/memory.py"
mutantes = ["write", "olvidar", "marcar", "restore"]
neutros  = ["recall", "verify", "backup"]

[[mutaciones.almacen]]
modulo   = "aura_skeleton/core/reglas.py"
mutantes = ["crear", "desactivar"]
neutros  = ["aplicables", "listar", "evaluar_condicion", "resolver_args"]

# --- GRUPO C · EXCLUIDOS del alcance de almacenes, con su razon.
#
# El CEO exigio que estas exclusiones NO fueran silenciosas: quedan escritas aqui, con motivo, para
# que cualquiera pueda discutirlas. Excluir no es autorizar: significa que la escritura de estos
# modulos no es persistencia de datos cuya destruccion deba gobernar esta regla.
[[mutaciones.excluido]]
modulo = "aura_skeleton/core/kill_switch.py"
motivo = "No es un almacen de datos del usuario. Escribe y borra un fichero CENTINELA cuya presencia ES la senal de parada (Bible 5.3 §5). Someterlo al Motor Unico seria circular: el kill switch es el paso 0 del propio Motor."
desde  = "2026-08-18"

[[mutaciones.excluido]]
modulo = "aura_skeleton/core/centro_gobierno.py"
motivo = "Mantiene una PROYECCION regenerable (~/.aura/CENTRO-DE-GOBIERNO.md). ADR-0023: el historial es la unica fuente de verdad y las proyecciones deben poder eliminarse y regenerarse; gobernar su escritura no protege ningun dato."
desde  = "2026-08-18"

# --- D-A006-4 (decisión del CEO, 2026-09-09) · exclusiones POR OPERACIÓN.
#
# GRUPO A no se amplía y D-G1-2 no se toca. Estas cuatro entradas declaran `opera`, así que eximen
# SOLO las operaciones nombradas: una escritura nueva —otra operación, u otra en un módulo que no la
# declaró— se sigue acusando. Una exclusión no es una autorización genérica.

[[mutaciones.excluido]]
modulo = "aura_skeleton/adapters/computador.py"
opera  = ["unlink", "rename"]
motivo = "Es el adaptador de dominio que el Motor Unico INVOCA: su escritura ES el efecto ya autorizado -catalogo, permisos, HITL y kill switch han corrido antes-, no una via alternativa. `os.unlink` y `os.rename` van con `dir_fd` y rechazan enlaces y colisiones (D32). Gobernar aqui seria gobernar dos veces el mismo acto."
desde  = "2026-09-09"

[[mutaciones.excluido]]
modulo = "aura_skeleton/adapters/programador.py"
opera  = ["write_bytes"]
motivo = "Ejecutor del ciclo interno: escribe el fichero, lo verifica y lo devuelve byte a byte si la verificacion falla. No persiste datos del usuario -toca el repositorio, dentro del perimetro de autoconstruccion-, y su efecto solo sobrevive si la verificacion lo respalda."
desde  = "2026-09-09"

[[mutaciones.excluido]]
modulo = "aura_skeleton/conectores/auditoria.py"
opera  = ["open", "replace"]
motivo = "Escribe un CURSOR: la posicion hasta la que un conector ya leyo el audit log. No es dato del usuario y es regenerable -perderlo solo hace releer el historial-. Por ADR-0023 el historial es la unica fuente de verdad y una proyeccion regenerable no es persistencia cuya destruccion deba gobernar G-1."
desde  = "2026-09-09"

[[mutaciones.excluido]]
modulo = "aura_skeleton/core/decisiones.py"
opera  = ["open", "replace"]
motivo = "Buzon de aprobacion DIFERIDA de lista roja (acta del CEO 2026-08-10). Escritura atomica via temporal + `os.replace` porque el CEO puede estar leyendolo mientras AURORA anexa. Es el mecanismo POR EL QUE se pide autorizacion humana, no una via para saltarsela: someterlo al Motor seria circular, como el kill switch."
desde  = "2026-09-09"

# --- Campaña de presencia (mandato del CEO, 2026-09-26) · exclusión POR OPERACIÓN, mismo criterio
# que D-A006-4: exime SOLO `remove` en este módulo; cualquier otra escritura se sigue acusando.
[[mutaciones.excluido]]
modulo = "aura_skeleton/adapters/microfono.py"
opera  = ["remove"]
motivo = "Borra audio EFIMERO del usuario: su grabacion del microfono tras transcribirla y el WAV de la respuesta tras reproducirlo. No es persistencia cuya destruccion deba gobernar G-1: es justo lo contrario, la proteccion de privacidad (Bible 5.5, lo oido no se archiva). Someter el borrado al Motor Unico no protegeria ningun dato y retrasaria la eliminacion de la voz."
desde  = "2026-09-27"

# --- NODO-01 (mision del CEO 2026-09-30, DP-NODO-01; declaraciones G-1 R-B APROBADAS por el CEO el
# 2026-10-04) · exclusiones POR OPERACION, mismo criterio que D-A006-4: cada una exime solo las
# operaciones listadas en su modulo; cualquier otra escritura se sigue acusando.
[[mutaciones.excluido]]
modulo = "aura_skeleton/adapters/identidad_nodo.py"
opera  = ["replace", "unlink"]
motivo = "Escribe la IDENTIDAD propia del nodo (un uuid), no un dato del usuario. tmp + `os.replace` es la escritura atomica que exige DP-NODO-01 §4.1 (nunca una identidad a medio escribir); `unlink` solo limpia el temporal si la escritura falla. Pasarla por el Motor Unico seria circular: el nodo necesita su identidad para existir antes de cualquier accion."
desde  = "2026-10-04"

[[mutaciones.excluido]]
modulo = "aura_skeleton/adapters/receptor_nodos.py"
opera  = ["replace"]
motivo = "Proyeccion regenerable del estado de la red en HC-1 (ultimo latido de cada nodo y vida del receptor): no es dato del usuario y los nodos vuelven a latir cada pocos segundos. `os.replace` hace atomica la escritura y aparta -sin borrar- un registro corrupto como `.corrupto-<ts>`."
desde  = "2026-10-04"

[[mutaciones.excluido]]
modulo = "aura_skeleton/nodo_agente.py"
opera  = ["replace"]
motivo = "Estado LOCAL del agente en el propio nodo (conectado, ultimo envio, ultimo error): diagnostico regenerable, no dato del usuario. Escritura atomica tmp + `os.replace` para que `--estado` nunca lea un JSON a medio escribir."
desde  = "2026-10-04"


# --- DN-1 (2026-10-27): escrituras de BAJO NIVEL que F2 ampliado hace visibles -----------------
# Hasta DN-1, R-B no veia `os.open/os.write/os.ftruncate/os.fdopen`, `tempfile.mkstemp` ni
# `wave.open(...,"wb")`: estas escrituras SIEMPRE estuvieron en el codigo (adaptadores y, tras el
# merge de delegacion, la biblioteca de nodos), pero el verificador no las perseguia. Clasificarlas
# NO autoriza comportamiento nuevo: hace contable lo que ya existia. Exclusion POR OPERACION
# (D-A006-4): exime SOLO la operacion calificada listada; un `unlink`/`open`(builtin)/operacion nueva
# se sigue acusando. REQUIERE RATIFICACION DEL CEO como D-G1-2/D-A006-4 (ver CHECKPOINT ak+). Ningun
# modulo pasa a `persistencia_autorizada`; la visibilidad de futuras escrituras se conserva.

[[mutaciones.excluido]]
modulo = "aura_skeleton/adapters/computador.py"
opera  = ["os.open", "os.write", "os.fdopen"]
motivo = "Mismo adaptador que el Motor Unico INVOCA (ya excluido para unlink/rename desde 2026-09-09): su escritura ES el efecto ya autorizado. `os.open`(O_WRONLY|O_CREAT|O_TRUNC|O_NOFOLLOW, dir_fd) + `os.fdopen`/`os.write` es su escritura atomica resistente a symlink del fichero destino. No es una via alternativa al motor."
desde  = "2026-10-27"

[[mutaciones.excluido]]
modulo = "aura_skeleton/adapters/jsonl_durable.py"
opera  = ["os.open", "os.write", "os.ftruncate"]
motivo = "Primitiva de anadido durable (append-only, O_EXCL|O_APPEND|O_NOFOLLOW 0600 + flock + fsync) para el ESTADO DE SEGURIDAD de la delegacion (ordenes consumidas, diario HC-1), no dato del usuario. `os.write` ES el anadido de una linea y `os.ftruncate` recorta SOLO una cola truncada ya detectada; ambas son el mecanismo del almacen, no una via alternativa. La delegacion no esta cableada a produccion."
desde  = "2026-10-27"

[[mutaciones.excluido]]
modulo = "aura_skeleton/adapters/firma_delegacion.py"
opera  = ["os.open", "os.fdopen"]
motivo = "Material criptografico y ancla de revocados de la delegacion, no dato del usuario. `os.open`(O_WRONLY|O_CREAT|O_EXCL 0600)+`os.fdopen` escribe la clave privada PKCS8 sin pisar una existente; `os.open`(O_APPEND|O_NOFOLLOW 0600) abre el ancla tam+sha256 append-only (el anadido pasa por `anexar`, DN-2) que detecta el truncado de la lista. Verifica propietario y permisos antes de escribir. No cableado a produccion."
desde  = "2026-10-27"

[[mutaciones.excluido]]
modulo = "aura_skeleton/adapters/diario_hc1.py"
opera  = ["os.open"]
motivo = "Centinela de INSTANCIA UNICA del diario HC-1: `os.open`(O_RDWR|O_CREAT|O_NOFOLLOW|O_NONBLOCK 0600) abre un fichero propio para tomar un `flock` EXCLUSIVO; no persiste datos del usuario, solo materializa el cerrojo de instancia (ALTO-1). Verifica propietario/permisos y falla cerrado. No cableado a produccion."
desde  = "2026-10-27"

[[mutaciones.excluido]]
modulo = "aura_skeleton/adapters/identidad_nodo.py"
opera  = ["os.fdopen", "tempfile.mkstemp"]
motivo = "Escribe la IDENTIDAD propia del nodo (un uuid), ya excluido para replace/unlink desde 2026-10-04. `tempfile.mkstemp`+`os.fdopen` es la escritura a temporal que luego se renombra atomicamente (tmp + os.replace, DP-NODO-01 §4.1): nunca una identidad a medio escribir. No es dato del usuario."
desde  = "2026-10-27"

[[mutaciones.excluido]]
modulo = "aura_skeleton/adapters/receptor_nodos.py"
opera  = ["os.open", "os.fdopen"]
motivo = "Proyeccion regenerable del estado de la red en HC-1 (ya excluido para replace desde 2026-10-04). `os.open`(O_WRONLY|O_CREAT|O_TRUNC 0600)+`os.fdopen` escribe el temporal que se renombra atomicamente; los nodos vuelven a latir cada pocos segundos. No es dato del usuario."
desde  = "2026-10-27"

[[mutaciones.excluido]]
modulo = "aura_skeleton/nodo_agente.py"
opera  = ["os.open", "os.fdopen"]
motivo = "Estado LOCAL del agente en el propio nodo (ya excluido para replace desde 2026-10-04). `os.open`(O_WRONLY|O_CREAT|O_TRUNC 0600)+`os.fdopen` escribe el temporal que se renombra atomicamente para que `--estado` nunca lea un JSON a medio escribir. Diagnostico regenerable, no dato del usuario."
desde  = "2026-10-27"

[[mutaciones.excluido]]
modulo = "aura_skeleton/adapters/microfono.py"
opera  = ["os.open", "os.fdopen", "wave.open"]
motivo = "Audio EFIMERO del usuario (ya excluido para remove desde 2026-09-27). `os.open`(O_WRONLY|O_CREAT|O_TRUNC 0600)+`os.fdopen` y `wave.open(...,'wb')` escriben la grabacion/respuesta WAV que se borra tras transcribir/reproducir. Es justo lo contrario de persistir: G-1 protege contra DESTRUCCION de datos, no contra escribir un efimero."
