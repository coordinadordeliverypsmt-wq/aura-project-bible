incremento = "Arnes OpenCode · validador de comandos (2026-08-25)"
# Cada mutante reabre una via de evasion concreta. La garantia: un comando compuesto NUNCA pasa.
pruebas = ["test_red_bypass.sh"]
nota = "se ejecuta con V=validador.py desde el propio directorio del arnes"
timeout_s = 60

[[mutante]]
id = "VAL-M1"
descripcion = "los metacaracteres dejan de bloquear: vuelve el bypass por encadenamiento"
fichero = "validador.py"
buscar = '''    if METACARACTERES.search(comando):
        return "DENEGADO"'''
sustituir = '''    if False:
        return "DENEGADO"'''

[[mutante]]
id = "VAL-M2"
