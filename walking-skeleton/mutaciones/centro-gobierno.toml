# --- D-1/D-5 (auditoria independiente, 2026-08-04): la RED DE GARANTIAS de publicar() tenia huecos --
# reales que las 22 pruebas previas no cubrian. El auditor demostro con estos 3 mutantes concretos que
# el panel del CEO podia CRECER SIN LIMITE (A1), dejar temporales huerfanos (A2) o perder la atomicidad
# sin que ninguna prueba lo notara (A3).

[[mutante]]
id = "A1"
garantia = "publicar() abre en modo APPEND en vez de sobrescribir: el panel crece sin limite en cada ciclo"
fichero = "aura_skeleton/core/centro_gobierno.py"
# NOTA: apendar sobre el `.tmp` (y luego seguir reemplazando con os.replace) NO reproduce el peligro:
# el temporal se consume en cada llamada porque `os.replace` lo RENOMBRA, asi que vuelve a nacer vacio
# en la siguiente publicacion (verificado: ese mutante SOBREVIVIA a la prueba de republicar). El riesgo
# real -- el que el auditor midio con ejecuciones reales de `--gobierno` creciendo 10->20->30 lineas --
# es apendar DIRECTO sobre `destino`, que si persiste entre publicaciones sucesivas.
buscar = '''    provisional = destino.with_name(destino.name + ".tmp")
    provisional.write_text(texto, encoding="utf-8")
    os.replace(provisional, destino)'''
sustituir = '''    with open(destino, "a", encoding="utf-8") as f:
        f.write(texto)'''

[[mutante]]
id = "A2"
garantia = "publicar() deja el fichero temporal HUERFANO: omite el reemplazo atomico"
fichero = "aura_skeleton/core/centro_gobierno.py"
buscar = '''    os.replace(provisional, destino)'''
sustituir = '''    pass'''

[[mutante]]
id = "A3"
garantia = "escritura NO atomica: escribe directo sobre el destino, sin fichero temporal ni os.replace"
fichero = "aura_skeleton/core/centro_gobierno.py"
buscar = '''    provisional = destino.with_name(destino.name + ".tmp")
    provisional.write_text(texto, encoding="utf-8")
    os.replace(provisional, destino)'''
sustituir = '''    destino.write_text(texto, encoding="utf-8")'''

