garantia = '''el callback no se retiene a nivel de módulo (se libera por GC)'''
fichero = "aura_skeleton/adapters/tts_espeak.py"
# La prueba que vigila esta garantía con una ASERCIÓN (weakref + gc.collect). Con el fichero entero,
# la prueba con la librería real muere antes por SIGSEGV y el arnés lo clasifica AMBIGUO.
pruebas = ["tests/unit/test_tts_espeak.py::test_el_callback_se_retiene_aunque_pase_el_recolector"]
buscar = '''    _callback = _CALLBACK(_acumular)
    lib.espeak_SetSynthCallback(_callback)
'''
sustituir = '''    _cb_local = _CALLBACK(_acumular)
    lib.espeak_SetSynthCallback(_cb_local)
'''

