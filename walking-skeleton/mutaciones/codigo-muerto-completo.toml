# --------- LOS TRES FALSOS POSITIVOS QUE ENCONTRO AURA EN PRODUCCION ---------

# CMC-M16, M18, M19 y M20 RETIRADOS el 2026-08-31 — **la regla que mutaban se mudo**.
#   Los cuatro atacaban las reglas de `__future__`, `__all__` y los `__dunder__` mientras vivian
#   dentro del descubridor. Al construirse la segunda barrera, esas reglas pasaron a `es_eliminable()`
#   —un solo sitio, consultado por el descubridor y por el ejecutor—, asi que sus patrones dejaron de
#   existir y el arnes los reportaba NO_APLICADO, que nunca cuenta como detectado.
#   Sus garantias las cubren ahora `SB-M1` (dunder), `SB-M2` (__future__), `SB-M3` y `SB-M4` (__all__)
#   en `mutaciones/segunda-barrera.toml`, y ademas `SB-M6`, que comprueba que el descubridor la
#   consulta en vez de reimplementarla. No se pierde cobertura: se deja de medir dos veces lo mismo.

