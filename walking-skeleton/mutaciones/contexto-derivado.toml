# en una tarea impide que el ciclo las escale por separado: una que no se pueda resolver arrastraria
# a las demas.
[[mutante]]
id = "C8"
garantia = "se mezclan varias garantias rotas en una sola tarea derivada"
fichero = "aura_skeleton/core/estado_operativo.py"
buscar = '''    primera = rotas[0] if isinstance(rotas, list) and rotas and isinstance(rotas[0], dict) else {}'''
sustituir = '''    primera = {k: v for r in rotas if isinstance(r, dict) for k, v in r.items()} if rotas else {}'''
