# (b) UNA SUPERFICIE PREVIA LE ROBA UNA FRASE A UNA NUEVA: en la cascada de `on_turn`, "reglas:
# consulta" (superficie 6 de las 8 previas) se evalua ANTES que "capacidades" (superficie nueva).
# Si su tabla de patrones se ensancha para incluir "que capacidades tienes", esa frase nunca llega
# a la superficie nueva: la roba una superficie previa, exactamente la clase de interferencia que
# CHECKLIST-CONTINUIDAD.md #4.6 documenta entre las 8 superficies existentes.
[[mutante]]
id = "M2"
garantia = "reglas:consulta le roba la frase 'que capacidades tienes' a la superficie nueva de capacidades"
fichero = "aura_skeleton/core/orchestrator.py"
buscar = '''_PAT_REGLAS_VER = ("que automatizaciones", "que automatizacion", "mis automatizaciones", "que reglas", "mis reglas")'''
sustituir = '''_PAT_REGLAS_VER = ("que automatizaciones", "que automatizacion", "mis automatizaciones", "que reglas", "mis reglas", "que capacidades tienes")'''

