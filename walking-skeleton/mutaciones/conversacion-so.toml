    """True si el usuario pregunta que puede hacer AURA ("¿que capacidades tienes?")."""
    return any(p in _normalizar(texto) for p in _PAT_CAPACIDADES)'''
sustituir = '''def _es_consulta_de_capacidades(texto: str) -> bool:
