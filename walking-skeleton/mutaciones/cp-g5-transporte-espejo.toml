incremento = "CP · G5 transporte y espejo GitHub (2026-08-24)"
# Las garantias de G5 son dos: el espejo NUNCA es fuente (su fallo no rompe el canal) y el
# transporte es un ADAPTADOR sustituible con superficie exactamente de dos metodos.
# Nodeids verificados contra `grep def test_` antes de declarar esta bateria.
pruebas = ["test_red_communication_plane.py::test_el_canal_funciona_entero_sin_red",
           "test_red_communication_plane.py::test_la_sincronizacion_con_github_es_opcional_y_su_fallo_no_rompe_el_canal",
           "test_red_communication_plane.py::test_el_transporte_es_un_adaptador_sustituible",
           "test_red_transporte.py::test_el_transporte_expone_exactamente_entregar_y_recoger"]
timeout_s = 120

