[[mutante]]
id = "AUTO-M1"
descripcion = "el selector ignora debe_ejecutar: ejecutaria tareas completadas o bloqueadas"
fichero = "control_plane.py"
buscar = '''        puede, porque = debe_ejecutar(estado, ident)'''
sustituir = '''        puede, porque = True, "sin comprobar"'''

[[mutante]]
id = "AUTO-M2"
descripcion = "con la lista vacia se inventa una tarea en vez de devolver None"
fichero = "control_plane.py"
buscar = '''    if not candidatas:
        return None, ('''
sustituir = '''    if not candidatas:
        return {"id": "INVENTADA"}, ('''

[[mutante]]
id = "AUTO-M3"
descripcion = "una decision que bloquea deja de detener la cadena: se devuelve igualmente"
fichero = "control_plane.py"
buscar = '''        if puede:
            return tarea, f"{ident}: {porque}"'''
sustituir = '''        if True:
            return tarea, f"{ident}: {porque}"'''

[[mutante]]
id = "AUTO-M4"
