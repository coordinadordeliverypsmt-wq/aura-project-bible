incremento = "Control Plane · seleccion automatica de tarea AUTO (2026-08-25)"
# El plano de este catalogo. Sin esto el auditor lo resolvia contra el producto
# y daba AUSENTE a todos sus mutantes (defecto corregido el 2026-09-09).
raiz = "../entorno/control-plane"
# La garantia central: AURA NO puede darse trabajo a si misma. El selector solo lee lo que el CEO
# autorizo y aplica debe_ejecutar. Los mutantes degradan esa contencion.
pruebas = ["test_red_siguiente_auto.py"]
