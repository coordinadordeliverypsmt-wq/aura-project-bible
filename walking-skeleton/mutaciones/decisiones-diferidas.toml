# (2) LA APROBACION OBSOLETA VUELVE A VALER. La huella deja de incluir los argumentos, asi que un
# permiso dado para escribir en /tmp/x autorizaria escribir en CUALQUIER sitio. Es la regla 5.
[[mutante]]
id = "D2"
garantia = "la huella ignora los argumentos: una aprobacion sirve para una accion sobre otro objetivo"
fichero = "aura_skeleton/core/decisiones.py"
buscar = '''        {"accion": accion, "argumentos": argumentos_del_usuario(args), "previsualizacion": previsualizacion},'''
sustituir = '''        {"accion": accion, "previsualizacion": previsualizacion},'''

# (3) EL EFECTO PREVISTO DEJA DE CONTAR. Se aprueba CREAR un fichero y se ejecuta SOBRESCRIBIR el
# que apareció mientras tanto. Es la garantia que hace esto mas fuerte que confirmar en vivo.
[[mutante]]
id = "D3"
garantia = "la huella ignora el efecto previsto: se ejecuta un efecto distinto del que el CEO aprobo"
fichero = "aura_skeleton/core/decisiones.py"
buscar = '''        {"accion": accion, "argumentos": argumentos_del_usuario(args), "previsualizacion": previsualizacion},
        sort_keys=True,'''
sustituir = '''        {"accion": accion, "argumentos": argumentos_del_usuario(args)},
        sort_keys=True,'''

# (4) UN RECHAZO SE LEE COMO APROBACION. El "no" del CEO tiene que valer tanto como el "si".
[[mutante]]
