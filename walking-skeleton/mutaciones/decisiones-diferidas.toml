garantia = "una decision RECHAZADA por el CEO autoriza la accion"
fichero = "aura_skeleton/core/decisiones.py"
buscar = '''        return str(estado) if estado in (_PENDIENTE, _APROBADA, _RECHAZADA) else None'''
sustituir = '''        return _APROBADA'''

