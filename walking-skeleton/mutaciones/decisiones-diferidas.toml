# ================================================================================================
# LOS CUATRO IRRENUNCIABLES: el silencio NO puede convertirse en permiso.
# Son las reglas 1, 6 y 7 del acta del CEO. Si alguno sobrevive, la aprobacion diferida se habria
# convertido en aprobacion automatica, que es exactamente lo que el CEO prohibio.
# ================================================================================================

# (1) FAIL OPEN. El caso mas grave posible: sin decision del CEO, se autoriza igual.
[[mutante]]
id = "D1"
garantia = "sin aprobacion del CEO la accion se autoriza igual: el silencio se convierte en permiso"
