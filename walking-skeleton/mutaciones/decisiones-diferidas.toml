        if decision is None:
            return None'''
sustituir = '''        decision = next(iter(self._todas(_APROBADA)), None) or self._leer(self._ruta(huella))
        if decision is None:
            return None'''

# (6) UN FICHERO CORRUPTO AUTORIZA. El CEO edita estos ficheros a mano: un JSON mal cerrado es un
# accidente probable, y el resultado seguro de un accidente es que NO se ejecute nada.
[[mutante]]
id = "D6"
garantia = "un fichero de decision corrupto o ilegible se trata como aprobacion"
