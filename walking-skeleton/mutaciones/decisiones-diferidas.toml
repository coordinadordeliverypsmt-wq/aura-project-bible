# INTEGRIDAD DEL BUZON
# ================================================================================================

# (5) LA HUELLA SE LEE DEL FICHERO EN VEZ DE RECALCULARSE. Entonces basta con editar un fichero para
# aprobar cualquier cosa: el contenido dejaria de tener que corresponder con lo que se ejecuta.
[[mutante]]
