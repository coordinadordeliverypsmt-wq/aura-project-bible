buscar = '''        res = await self.motor.ejecutar(
            accion, dict(tarea.args), trace_id, f"{trace_id}:{tarea.tarea_id}", origen=f"director:{tarea.responsable}"
        )'''
sustituir = '''        res = {"accion": accion, "estado": "ejecutada"}'''

