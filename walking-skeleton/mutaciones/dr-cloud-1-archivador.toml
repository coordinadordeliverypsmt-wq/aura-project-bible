# --- DR-CLOUD-2 · la copia se demuestra, no se supone -------------------------------------------
# Sin estos mutantes, «verificado: true» seria una etiqueta que nadie comprueba. Cada uno devuelve el
# archivador al estado en que la auditoria lo encontro: escribir y dar por buena la escritura.

