incremento = "G-1 · R-A por alcance de autoridad, no por nombre (D-A006-3, 2026-09-09)"
# La garantia nueva no es «R-A ya no acusa a crear/desactivar»: es que la exencion sea **estrecha**.
# Una exencion que se ensancha en silencio convierte R-A en decorativa, y R-A es la unica red de la
# Ruta Unica de Mutacion. Cada mutante ensancha la exencion de una forma distinta.
# Nodos concretos, no el fichero entero: `test_g1_rb_...` esta en rojo por D-A006-4 —la lista
# `persistencia_autorizada` es aprobacion reservada al CEO— y una base en rojo invalida el arnes.
# Se declaran las pruebas que de verdad cubren esta garantia; declarar de mas ocultaria supervivientes.
pruebas = [
  "tests/unit/test_g1_ruta_unica.py::test_g1_ra_ninguna_operacion_de_almacen_fuera_de_los_modulos_autorizados",
  "tests/unit/test_g1_ruta_unica.py::test_las_cuatro_rutas_de_alerta_006_ALCANZAN_el_motor",
  "tests/unit/test_g1_ruta_unica.py::test_la_exencion_por_alcance_de_autoridad_es_ESTRECHA",
  "tests/unit/test_g1_ruta_unica.py::test_control_el_verificador_detecta_una_llamada_ilegitima",
  "tests/unit/test_g1_ruta_unica.py::test_capa5_un_tipo_sin_el_metodo_mutante_no_vuelve_gobernada_la_llamada",
  "tests/unit/test_g1_ruta_unica.py::test_solo_EL_MOTOR_concede_la_exencion_no_cualquier_cosa_con_ejecutar",
]
