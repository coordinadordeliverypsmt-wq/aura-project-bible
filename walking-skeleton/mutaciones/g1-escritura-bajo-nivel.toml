[[mutante]]
id = "M10"
garantia = "sin la exclusion de wave.open de tts_espeak, R-B vuelve a acusar el WAV de voz"
fichero = "architecture_manifest.toml"
pruebas = ["tests/unit/test_g1_ruta_unica.py"]
buscar = '''modulo = "aura_skeleton/adapters/tts_espeak.py"
opera  = ["wave.open"]'''
# `opera` vacio NO vale como mutante: el verificador trata una lista falsy como exclusion de MODULO ENTERO
# (tts_espeak quedaria igualmente exento y el mutante sobreviviria). Un `opera` ficticio no vacio que NO cubre
# wave.open deja el modulo como por-operacion y hace reaparecer el hallazgo.
sustituir = '''modulo = "aura_skeleton/adapters/tts_espeak.py"
opera  = ["os.chmod"]'''

