incremento = "PIEZA 3: `--gobierno` publica el estado operativo real del sistema compuesto (+ D-3/D-4 auditoria)"
pruebas = ["tests/integration/test_composicion.py::test_el_ejecutable_gobierno_publica_el_estado_operativo_real"]

[[mutante]]
id = "M1"
garantia = "el panel deja de construirse con el estado REAL: usa panel() vacio (todo INEXISTENTE)"
fichero = "aura_skeleton/__main__.py"
buscar = '''    secciones = panel(estado=sistema.estado_operativo, objetivo=activos or None)'''
sustituir = '''    secciones = panel()'''

[[mutante]]
id = "M2"
garantia = "los objetivos activos dejan de leerse del estado: el panel queda vacio aunque haya trabajo real"
fichero = "aura_skeleton/__main__.py"
# El patron incluye la linea siguiente porque `_servir()` (PIEZA 1, en el mismo fichero) repite
# `activos = sistema.estado_operativo.objetivos_activos()` palabra por palabra: sin este contexto el
# arnes lo marca AMBIGUO (aparece 2 veces) en vez de aplicar el mutante donde corresponde.
buscar = '''    activos = sistema.estado_operativo.objetivos_activos()
    secciones = panel(estado=sistema.estado_operativo, objetivo=activos or None)'''
sustituir = '''    activos = []
    secciones = panel(estado=sistema.estado_operativo, objetivo=activos or None)'''

