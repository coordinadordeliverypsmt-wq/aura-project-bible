        _gobierno(sistema)
        return 0'''

# --- D-3 (auditoria independiente, 2026-08-04): el panel debe cubrir TODOS los objetivos activos ---
# El bug real: `activos[0] if activos else None` elegia el objetivo alfabeticamente PRIMERO y
# DESCARTABA el resto sin avisar. Con dos objetivos reales, uno bloqueado y otro no, el panel afirmaba
# "sin riesgos activos" cuando el segundo SI tenia tareas detenidas -- una afirmacion falsa firmada
# como [AURORA]. `pruebas` se acota a la prueba de DOS objetivos: la global (un solo objetivo activo)
# no distingue "cubre todos" de "cubre el unico que hay".

[[mutante]]
id = "A4"
garantia = "el panel vuelve a cubrir un solo objetivo (el primero alfabetico) y oculta el resto sin avisar"
fichero = "aura_skeleton/__main__.py"
buscar = '''    secciones = panel(estado=sistema.estado_operativo, objetivo=activos or None)'''
sustituir = '''    secciones = panel(estado=sistema.estado_operativo, objetivo=(activos[0] if activos else None))'''
pruebas = ["tests/integration/test_composicion.py::test_gobierno_CUBRE_TODOS_los_objetivos_activos_no_solo_el_PRIMERO"]
