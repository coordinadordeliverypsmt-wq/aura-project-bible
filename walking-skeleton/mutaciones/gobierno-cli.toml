fichero = "aura_skeleton/__main__.py"
buscar = '''    ruta = os.path.join(os.path.dirname(sistema.ruta_memoria), "CENTRO-DE-GOBIERNO.md")'''
sustituir = '''    ruta = "/tmp/CENTRO-DE-GOBIERNO-mutante-M3.md"'''

