sustituir = '''        hechos = list(vivas)'''

[[mutante]]
id = "HD-M7"
garantia = "gana la PRIMERA declaracion: corregirse dejaria de funcionar"
fichero = "aura_skeleton/core/orchestrator.py"
# PATRON AMPLIADO (2026-09-10): la ruta posesiva general anadio un segundo `reversed(hechos)` y este
# mutante quedo AMBIGUO -aparece 2 veces-, es decir, dejo de proteger nada. Se desambigua con la linea
# siguiente, que es la que distingue la resolucion por TABLA de la resolucion por atributo.
buscar = '''            for entrada in reversed(hechos):
                valor = _valor_declarado(str(entrada.get("contenido", "")), patron)'''
sustituir = '''            for entrada in hechos:
                valor = _valor_declarado(str(entrada.get("contenido", "")), patron)'''
