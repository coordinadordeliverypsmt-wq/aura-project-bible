incremento = "Un hecho declarado lo responde el Core, con su valor exacto y sin modelo (CEO, 2026-09-10)"
# La garantia tiene DOS mitades y ninguna sirve sola: si el enunciado deja de clasificarse, no hay hecho
# que leer; si la fila de la tabla desaparece, no hay con que responder. Y la tercera cosa que debe
# seguir muriendo: que el valor salga EXACTO, porque el defecto medido fue un hecho DEFORMADO.
pruebas = ["tests/unit/test_hecho_declarado_sin_llm.py",
           "tests/unit/test_frontera_cognitiva.py"]
timeout_s = 180

# HD-M1 SE RETIRO el 2026-09-10. Mutaba el patron especifico `mi color favorito es` de `_HECHO`, que
# ya no existe: la apertura posesiva generica lo absorbio. El mutante sobrevivia -romper un patron que
# nadie usa no rompe nada-, y un mutante que sobrevive sin garantia detras es ruido, no una red. La
# garantia equivalente la cubre `HP-M1` en `mutaciones/hechos-posesivos-generales.toml`.

[[mutante]]
id = "HD-M2"
garantia = "la fila de la tabla desaparece: la pregunta vuelve a caer al modelo"
fichero = "aura_skeleton/core/orchestrator.py"
buscar = '''        ("cual es mi color favorito", "cual es mi color preferido"),'''
sustituir = '''        ("cual es mi color JAMAS PREGUNTADO",),'''

[[mutante]]
