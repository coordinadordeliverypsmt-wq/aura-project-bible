# NOTA sobre mutantes EQUIVALENTES (verificado 2026-08-03). Dos degradaciones evidentes NO cambian el
# comportamiento y por eso no figuran aqui:
#   - quitar `par[0]` del desempate: `puntuados` se construye desde `sorted(candidatos)` y el sort de
#     Python es estable, asi que el orden ya era determinista antes de la clave.
#   - `if not consulta` -> `if False`: sin terminos informativos el bucle no itera, candidatos queda
#     vacio y el resultado es el mismo. La guarda es una optimizacion, no una decision.
# El no-determinismo ORIGINAL venia de iterar un `set` de CADENAS (cuyo hash depende de PYTHONHASHSEED);
# aqui se itera `sorted(consulta)` y enteros, cuyo hash no varia. Redundante a proposito.

