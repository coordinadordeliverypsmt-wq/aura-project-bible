# 10s: generoso frente a la suite normal (~2s) y acotado frente a M2/M3, que degradan una condicion
# de parada y por tanto SI cuelgan de verdad si el arnes no los corta (ver comentario de cada uno).
timeout_s = 10

[[mutante]]
id = "M1"
garantia = "el kill switch armado deja de impedir el latido: AURORA arranca trabajo con la parada echada"
fichero = "aura_skeleton/core/motor_ciclo.py"
buscar = '''        return self.kill_switch is not None and self.kill_switch.is_engaged()'''
sustituir = '''        return False'''

# M2 y M3 fueron RETIRADOS el 2026-08-03 y se REINCORPORAN aqui el 2026-08-04, tras dotar a
# `herramientas.mutar` de timeout por mutante (ver CLAUDE.md y `mutaciones/arnes-timeout.toml`).
# El motivo de la retirada sigue documentado porque importa: degradar la condicion de parada de
# CUALQUIERA de estos dos bucles produce un BUCLE INFINITO real, no una prueba que falla.
#
# Cada uno declara su PROPIA lista `pruebas`, mas acotada que la global: las pruebas historicas que
# cubren conceptualmente esta garantia (`test_se_detiene_solo_cuando_no_queda_trabajo`,
# `test_servir_espera_en_vez_de_girar_en_vacio`) tambien cuelgan de verdad con estos mutantes -su
# unica valvula depende exactamente de lo que el mutante degrada- y si se dejan en la lista, pytest
# se queda colgado EN ELLAS antes de llegar a ejecutar la prueba nueva que si tiene una valvula
# independiente (ver `tests/integration/test_motor_ciclo.py`, seccion "Garantias de TERMINACION de
# M2 y M3"). El timeout del arnes seguiria cortando el cuelgue igualmente -el mutante no se
# reportaria como muerto en falso ni bloquearia el arnes- pero acotar la prueba es lo que permite
# reportar "detectado" en segundos en vez de "TIMEOUT" tras agotar el plazo completo.

