pruebas = ["tests/integration/test_motor_ciclo.py::test_correr_no_gira_en_vacio_para_siempre_sin_trabajo"]
buscar = '''            if tarea is None:
                break  # sin trabajo accionable: se para, no se gira en vacio'''
sustituir = '''            if tarea is None:
                pass  # MUTANTE: nunca para'''

